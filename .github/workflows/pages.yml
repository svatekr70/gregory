# Sestaví projektový web ze site/ a nasadí ho na GitHub Pages.
# Web importuje knihovnu přímo ze src/, takže build zároveň ověří, že se
# dokumentace pořád opírá o aktuální kód.
name: Pages

on:
  push:
    branches: [main]
  # Ať jde nasazení spustit i ručně, bez commitu.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžná nasazení nemají smysl; poslední vyhrává. Rozdělaný běh se ale
# nepřerušuje, aby se Pages nezasekly v půlce publikace.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typy a testy hlídají, že se na web nedostane rozbitá verze knihovny.
      - run: npm run typecheck
      - run: npm test

      - run: npm run site:build

      # Vedle dokumentace se publikuje i sestavená knihovna, aby šla načíst
      # rovnou z URL — bez npm, bez klonování a bez lokálního buildu.
      - name: Přibalit sestavenou knihovnu
        run: |
          npm run build
          mkdir -p dist-site/dist
          cp dist/gregory.js dist/gregory.umd.cjs dist/gregory.css dist/gregory-themes.css dist-site/dist/
          cp -r dist/*.d.ts dist/core dist-site/dist/
          # UMD má příponu .cjs, kterou Pages servírují jako application/node.
          # Kopie s .js dostane správný MIME typ pro <script src>.
          cp dist/gregory.umd.cjs dist-site/dist/gregory.umd.js

      # Pojistka proti tomu, co se jednou stalo: tree-shaking zahodil import
      # stylů knihovny a nasadil se web s nenastylovaným kalendářem. Ve
      # vývojovém serveru to vidět není, protože ten netřese ničím.
      - name: Web musí nést styly pickeru
        run: grep -rq "gr-day" dist-site/assets/*.css

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
